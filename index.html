<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Materiales Centro — Prototipo: Terminaciones, Corralón y Mi presupuesto</title>
<style>
  :root{
    --bg:#EDE3D2; --ink:#181510; --muted:#8D8874; --line:rgba(24,21,16,.12);
    --green:#006D3A; --orange:#EB5C2E;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;color:var(--ink);font-family:'Barlow',system-ui,sans-serif;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
    background-color:var(--bg);
    background-image:
      repeating-linear-gradient(0deg, rgba(235,92,46,.14) 0 1px, transparent 1px 40px),
      repeating-linear-gradient(90deg, rgba(235,92,46,.14) 0 1px, transparent 1px 40px);
  }
  @font-face{font-family:'Barlow Condensed';src:local('Barlow Condensed');}

  /* header */
  header{display:flex;align-items:center;justify-content:space-between;padding:22px 24px;flex-wrap:wrap;gap:12px;}
  .logo{display:flex;align-items:center;}
  nav{display:flex;gap:26px;flex-wrap:wrap;align-items:center;}
  .navlink{all:unset;font-size:14px;font-weight:700;color:var(--ink);opacity:.55;cursor:pointer;}
  .navlink.active{opacity:1;border-bottom:2px solid var(--orange);padding-bottom:4px;}
  .navlink.disabled{cursor:default;}
  .cart-btn{all:unset;display:flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border:none;border-radius:4px;padding:10px 16px;font-size:13px;font-weight:600;cursor:pointer;}

  .eyebrow{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--muted);margin-bottom:14px;}
  .eyebrow .dot{color:var(--orange);font-size:10px;}
  .titlewrap{padding:56px 24px 36px;}
  h1{margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:46px;color:var(--ink);line-height:1;}

  .view[hidden]{display:none;}

  /* ===== Terminaciones: bands + product cards ===== */
  .accordion{padding:0 24px 60px;display:flex;flex-direction:column;gap:14px;}
  .band{border-radius:8px;overflow:hidden;border:1px solid rgba(0,0,0,.06);}
  .band-btn{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;width:100%;cursor:pointer;padding:38px 24px;gap:16px;min-height:150px;position:relative;background-size:cover;background-position:center;}
  .band-btn::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg, rgba(9,10,7,.72) 0%, rgba(9,10,7,.45) 55%, rgba(9,10,7,.18) 100%);}
  .band-left, .band-right{position:relative;z-index:1;}
  .band-left{display:flex;align-items:baseline;gap:16px;}
  .idx{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:15px;color:rgba(255,255,255,.55);}
  .name{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:32px;text-transform:uppercase;color:#fff;letter-spacing:.01em;}
  .brands{font-size:12px;color:rgba(255,255,255,.75);display:none;letter-spacing:.03em;}
  .band-right{display:flex;align-items:center;gap:18px;}
  .chev-wrap{width:38px;height:38px;border-radius:50%;border:1.5px solid rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .25s ease;}
  .band.open .chev-wrap, .family.open .chev-wrap{background:var(--orange);border-color:var(--orange);}
  .chev{transition:transform .25s ease;flex-shrink:0;stroke:#fff !important;}
  .band.open .chev, .family.open .chev{transform:rotate(180deg);}
  .band-1{background-color:#DCD4C2;background-image:linear-gradient(0deg, rgba(9,10,7,.32), rgba(9,10,7,.32)), repeating-linear-gradient(90deg, #DCD4C2 0 3px, #CFC6B0 3px 6px);}
  .band-2{background-color:#9AA0A3;background-image:linear-gradient(0deg, rgba(9,10,7,.35), rgba(9,10,7,.35)), repeating-linear-gradient(90deg, #8B9194 0 2px, #B7BCC0 2px 4px, #8B9194 4px 6px);}
  .band-3{background-color:#C9C2AE;background-image:linear-gradient(0deg, rgba(9,10,7,.3), rgba(9,10,7,.3)), repeating-linear-gradient(90deg, #C9C2AE 0 58px, #B9B2A0 58px 60px), repeating-linear-gradient(0deg, #C9C2AE 0 58px, #B9B2A0 58px 60px);}
  .band-4{background-color:#8A6A4A;background-image:linear-gradient(0deg, rgba(9,10,7,.35), rgba(9,10,7,.35)), repeating-linear-gradient(90deg, #8A6A4A 0 5px, #9C7C58 5px 10px, #7E5F42 10px 15px);}
  .band-5{background-color:#9BA3A6;background-image:linear-gradient(0deg, rgba(9,10,7,.35), rgba(9,10,7,.35)), repeating-linear-gradient(90deg, #8E9598 0 3px, #C7CCCE 3px 5px, #8E9598 5px 8px);}
  .panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease;}
  .band.open .panel, .family.open .panel{grid-template-rows:1fr;}
  .panel-inner{overflow:hidden;}
  .grid{display:grid;grid-template-columns:1fr;gap:16px;padding:6px 4px 32px;}
  .card{border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#fff;}
  .photo{height:130px;background:linear-gradient(135deg,var(--green) 0%,var(--green) 46%,var(--orange) 46%,var(--orange) 100%);display:flex;align-items:center;justify-content:center;}
  .photo span{color:#fff;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;opacity:.9;text-align:center;padding:0 16px;}
  .card-body{padding:14px;display:flex;flex-direction:column;gap:9px;}
  .pname{font-weight:600;font-size:13.5px;line-height:1.3;}
  .price{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:17px;color:var(--orange);}
  .qty-row{display:flex;align-items:center;gap:10px;margin-top:auto;}
  .qty-row input{width:56px;border:1px solid var(--line);border-radius:4px;padding:7px;font-size:13px;text-align:center;}
  .qty-row .unit{font-size:12px;color:var(--muted);}
  .add{background:var(--orange);color:#fff;border:none;border-radius:3px;padding:10px;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;}
  .add.added{background:var(--green);}

  /* ===== Corralón: families + flip cards ===== */
  .wrap{padding:0 24px 70px;display:flex;flex-direction:column;gap:16px;}
  .family{border-radius:8px;overflow:hidden;border:1px solid rgba(0,0,0,.06);}
  .family-btn{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;width:100%;cursor:pointer;padding:34px 24px;gap:16px;min-height:130px;position:relative;background-size:cover;background-position:center;}
  .family-btn::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg, rgba(9,10,7,.78) 0%, rgba(9,10,7,.55) 55%, rgba(9,10,7,.3) 100%);}
  .family-left,.family-right{position:relative;z-index:1;}
  .family-left{display:flex;align-items:baseline;gap:16px;}
  .f-idx{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:15px;color:rgba(255,255,255,.55);}
  .f-name{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:28px;text-transform:uppercase;color:#fff;letter-spacing:.01em;}
  .f-count{font-size:12px;color:rgba(255,255,255,.75);display:none;letter-spacing:.03em;}
  .family-right{display:flex;align-items:center;gap:18px;}
  .fam-1{background-image:linear-gradient(0deg, rgba(9,10,7,.4), rgba(9,10,7,.2)), url('https://images.unsplash.com/photo-1671051115163-c932f35fc7ca?w=1600&h=500&fit=crop&crop=entropy&auto=format&q=75');}
  .fam-2{background-image:linear-gradient(0deg, rgba(9,10,7,.4), rgba(9,10,7,.2)), url('https://images.unsplash.com/photo-1580398562556-d33329a0f29b?w=1600&h=500&fit=crop&crop=entropy&auto=format&q=75');}
  .fam-3{background-image:linear-gradient(0deg, rgba(9,10,7,.4), rgba(9,10,7,.2)), url('https://images.unsplash.com/photo-1689102816270-dc301aeaec35?w=1600&h=500&fit=crop&crop=entropy&auto=format&q=75');}
  .subgrid{display:grid;grid-template-columns:1fr;gap:14px;padding:18px 16px 30px;}
  .flip{perspective:1200px;min-height:240px;}
  .flip-inner{position:relative;width:100%;height:100%;min-height:240px;transition:transform .5s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;cursor:pointer;}
  .flip.flipped .flip-inner{transform:rotateY(180deg);}
  .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:6px;overflow:hidden;border:1px solid rgba(0,0,0,.08);}
  .front{background:linear-gradient(135deg,var(--green) 0%,var(--green) 46%,var(--orange) 46%,var(--orange) 100%);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;}
  .front span{color:#fff;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:20px;text-transform:uppercase;text-align:center;padding:0 16px;}
  .front small{color:rgba(255,255,255,.75);font-size:11px;letter-spacing:.06em;text-transform:uppercase;}
  .back{background:#fff;transform:rotateY(180deg);padding:18px;display:flex;flex-direction:column;gap:12px;}
  .back-title{font-weight:700;font-size:15px;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:11.5px;font-weight:600;color:#5C5747;background:#F7F5EF;}
  .chip.sel{background:var(--green);border-color:var(--green);color:#fff;}
  .stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:20px;overflow:hidden;}
  .stepper button{all:unset;width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;font-weight:700;color:var(--ink);}
  .stepper button:hover{background:#F0EBDD;}
  .stepper .count{width:30px;text-align:center;font-size:13px;font-weight:600;}
  .add-btn{background:var(--orange);color:#fff;border:none;border-radius:3px;padding:11px;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;}
  .add-btn.added{background:var(--green);}

  /* ===== Mi presupuesto ===== */
  .cart-wrap{padding:0 24px 80px;max-width:720px;}
  .cart-list{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:20px;}
  .cart-item{background:#fff;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .ci-name{font-weight:600;font-size:14px;}
  .ci-meta{font-size:12px;color:var(--muted);margin-top:3px;}
  .ci-right{display:flex;align-items:center;gap:14px;}
  .ci-price{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;color:var(--orange);white-space:nowrap;}
  .ci-remove{all:unset;cursor:pointer;font-size:18px;color:var(--muted);line-height:1;padding:4px;}
  .ci-remove:hover{color:var(--orange);}
  .cart-empty{padding:40px 18px;text-align:center;color:var(--muted);font-size:14px;background:#fff;border-radius:6px;border:1px solid var(--line);}
  .cart-total{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;background:#fff;border:1px solid var(--line);border-radius:6px;margin-bottom:32px;}
  .cart-total .label{font-size:13px;color:var(--muted);}
  .cart-total .value{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:22px;color:var(--ink);}
  .cart-total .note{font-size:11px;color:var(--muted);margin-top:2px;}

  .wa-block .eyebrow{margin-bottom:12px;}
  .phone{max-width:360px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#E8DFD0;box-shadow:0 8px 24px rgba(24,21,16,.12);}
  .phone-head{background:#005C4B;color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;}
  .phone-head .avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg, var(--orange), var(--green));flex-shrink:0;}
  .phone-head .who{font-size:14px;font-weight:700;}
  .phone-head .status{font-size:11px;opacity:.8;}
  .phone-body{padding:18px 14px;min-height:140px;display:flex;align-items:flex-end;}
  .bubble{margin-left:auto;background:#DCF8C6;color:#181510;border-radius:8px 8px 2px 8px;padding:10px 12px;font-size:13px;line-height:1.5;white-space:pre-wrap;max-width:88%;box-shadow:0 1px 1px rgba(0,0,0,.08);}
  .bubble .ts{display:block;text-align:right;font-size:10px;color:#5C5747;margin-top:4px;}
  .wa-send{display:inline-flex;align-items:center;gap:8px;background:#005C4B;color:#fff;text-decoration:none;border-radius:4px;padding:12px 20px;font-size:13px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;margin-top:20px;}

  @media(min-width:640px){
    .grid{grid-template-columns:repeat(2,minmax(0,1fr));}
    .brands{display:block;}
    header{padding:26px 48px;}
    .titlewrap{padding:64px 48px 40px;}
    .accordion{padding:0 48px 70px;gap:18px;}
    h1{font-size:60px;}
    .band-btn{padding:52px 40px;min-height:190px;}
    .name{font-size:44px;}
    .wrap{padding:0 48px 80px;gap:18px;}
    .family-btn{padding:46px 40px;min-height:170px;}
    .f-name{font-size:38px;}
    .f-count{display:block;}
    .subgrid{grid-template-columns:repeat(2,minmax(0,1fr));padding:22px 24px 36px;}
    .cart-wrap{padding:0 48px 90px;}
  }
  @media(min-width:960px){
    .grid{grid-template-columns:repeat(3,minmax(0,1fr));}
    .panel-inner .grid{padding:24px 40px 44px;}
    .subgrid{grid-template-columns:repeat(3,minmax(0,1fr));padding:26px 40px 44px;}
  }
</style>
</head>

];

function addToCart(item){
  cart.push({ id: 'c' + Date.now() + Math.random().toString(16).slice(2), ...item });
  renderCart();
}
function removeFromCart(id){
  cart = cart.filter(i => i.id !== id);
  renderCart();
}
function buildMessage(){
  if (cart.length === 0) return 'Hola! Quiero pedir un presupuesto.';
  const lines = cart.map(i => `• ${i.name} — ${i.qty} ${i.unit}`).join('\n');
  return `Hola! Quiero pedir un presupuesto para:\n\n${lines}\n\n¿Me pasan precios y disponibilidad? Gracias!`;
}
function renderCart(){
  document.getElementById('cart-badge').textContent = `Mi presupuesto · ${cart.length}`;

  const listEl = document.getElementById('cart-list');
  if (cart.length === 0){
    listEl.innerHTML = '<div class="cart-empty">Todavía no agregaste nada. Sumá productos desde Terminaciones o Corralón.</div>';
  } else {
    listEl.innerHTML = cart.map(i => `
      <div class="cart-item">
        <div>
          <div class="ci-name">${i.name}</div>
          <div class="ci-meta">${i.category} · ${i.qty} ${i.unit}</div>
        </div>
        <div class="ci-right">
          <div class="ci-price">${i.price}</div>
          <button class="ci-remove" data-id="${i.id}" aria-label="Quitar">×</button>
        </div>
      </div>
    `).join('');
    listEl.querySelectorAll('.ci-remove').forEach(btn => {
      btn.addEventListener('click', () => removeFromCart(btn.dataset.id));
    });
  }

  document.getElementById('cart-total-value').textContent = '$0';

  const msg = buildMessage();
  document.getElementById('wa-bubble').innerHTML = msg.replace(/\n/g,'<br>') + '<span class="ts">22:41 ✓✓</span>';
  document.getElementById('wa-link').href = 'https://wa.me/?text=' + encodeURIComponent(msg);
}

/* ---------- view switching ---------- */
function showView(view){
  document.querySelectorAll('.view').forEach(v => v.hidden = (v.id !== 'view-' + view));
  document.querySelectorAll('.navlink[data-view]').forEach(b => b.classList.toggle('active', b.dataset.view === view));
}
document.querySelectorAll('.navlink[data-view]').forEach(btn => {
  btn.addEventListener('click', () => showView(btn.dataset.view));
});
document.getElementById('cart-toggle').addEventListener('click', () => {
  document.querySelectorAll('.navlink[data-view]').forEach(b => b.classList.remove('active'));
  showView('presupuesto');
});

function backContent(sub){
  const chips = sub.models.length > 1
    ? `<div class="chips">${sub.models.map((m,i)=>`<span class="chip${i===0?' sel':''}">${m}</span>`).join('')}</div>`
    : `<div style="font-size:12.5px;color:#8D8874;">${sub.models[0]}</div>`;
  return `
    <div class="back-title">${sub.name}</div>
    ${chips}
    <div class="price">${sub.price}</div>
    <div class="qty-row">
      <div class="stepper">
        <button type="button" class="minus" aria-label="Restar">−</button>
        <span class="count">1</span>
        <button type="button" class="plus" aria-label="Sumar">+</button>
      </div>
      <span class="unit">${sub.unit}</span>
    </div>
    <button class="add-btn" type="button">Agregar a mi presupuesto</button>
  `;
}

function makeFlipCard(sub, familyName){
  const el = document.createElement('div');
  el.className = 'flip';
  el.innerHTML = `
    <div class="flip-inner">
      <div class="face front">
        <span>${sub.name}</span>
        <small>${sub.models.length > 1 ? sub.models.length + ' modelos' : '1 modelo'}</small>
      </div>
      <div class="face back">${backContent(sub)}</div>
    </div>
  `;
  const countEl = el.querySelector('.count');
  el.querySelector('.minus').addEventListener('click', (e) => {
    e.stopPropagation();
    countEl.textContent = Math.max(0, parseInt(countEl.textContent, 10) - 1);
  });
  el.querySelector('.plus').addEventListener('click', (e) => {
    e.stopPropagation();
    countEl.textContent = parseInt(countEl.textContent, 10) + 1;
  });
  const addBtn = el.querySelector('.add-btn');
  addBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const qty = Math.max(0, parseInt(countEl.textContent, 10));
    if (qty === 0) return;
    const selChip = el.querySelector('.chip.sel');
    const modelName = selChip ? selChip.textContent : sub.models[0];
    addToCart({ name: modelName, category: familyName, qty, unit: sub.unit, price: sub.price });
    addBtn.textContent = 'Agregado ✓';
    addBtn.classList.add('added');
    setTimeout(() => { addBtn.textContent = 'Agregar a mi presupuesto'; addBtn.classList.remove('added'); }, 1200);
  });
  el.querySelector('.flip-inner').addEventListener('click', (e) => {
    if (e.target.closest('.chip')) {
      e.currentTarget.parentElement.querySelectorAll('.chip').forEach(c => c.classList.remove('sel'));
      e.target.classList.add('sel');
      return;
    }
    if (e.target.closest('.stepper') || e.target.closest('.add-btn')) return;
    el.classList.toggle('flipped');
  });
  return el;
}
